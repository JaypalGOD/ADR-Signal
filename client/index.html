<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADR Signal</title>
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') }
      catch { document.documentElement.dataset.theme = 'dark' }
    </script>
    <meta name="description" content="Report a medicine side effect in your own words. Supports India's Pharmacovigilance Programme (PvPI)." />
    <meta name="theme-color" content="#04070a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f7f5" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
